[project]
name = "backend"
version = "0.1.0"
description = "API for the freelance dashboard"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
