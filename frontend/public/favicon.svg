<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mochi's mark as src/components/MochiMark.tsx draws it, following the system's light or dark mode. -->
  <style>
    .ground { fill: #e5e3f3; }
    .mochi { fill: #fbfaf7; stroke: #1c1c1a; stroke-width: 3.5; }
    .shadow { fill: #cfcbe8; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #1c1c1a; }
      .mochi { fill: #f2f1ec; stroke: none; }
      .shadow { fill: #2e2e2b; }
    }
  </style>
  <rect class="ground" width="100" height="100" rx="34"/>
  <ellipse class="shadow" cx="50" cy="74" rx="26.9" ry="3.8"/>
  <path class="mochi" d="M22 64.2C22 43.2 34.9 31 50 31C65.1 31 78 43.2 78 64.2C78 70.9 71.3 73 50 73C28.7 73 22 70.9 22 64.2Z"/>
  <circle cx="42" cy="54.9" r="2.4" fill="#1c1c1a"/>
  <circle cx="58" cy="54.9" r="2.4" fill="#1c1c1a"/>
  <ellipse cx="34.8" cy="60.4" rx="3.6" ry="2" fill="#e89f82"/>
  <ellipse cx="65.2" cy="60.4" rx="3.6" ry="2" fill="#e89f82"/>
</svg>
