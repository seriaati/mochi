# The Android app: a v* tag (v0.1.0) builds it signed, with that version, and attaches it to the
# tag's GitHub Release as mochi.apk. Run it by hand (Actions → Android → Run workflow) to build one
# as a workflow artifact without a release.
#
# Signing uses the project's key, kept in two repository secrets. Android installs an update only
# when it's signed with the same key, so make it once, back it up and never change it:
#   password=$(openssl rand -hex 16)
#   keytool -genkeypair -keystore mochi.keystore -storepass "$password" -keypass "$password" \
#     -alias mochi -keyalg RSA -keysize 4096 -validity 36500 -dname CN=mochi
#   base64 -w0 mochi.keystore | gh secret set ANDROID_KEYSTORE_BASE64
#   printf %s "$password" | gh secret set ANDROID_KEYSTORE_PASSWORD
# (keytool comes with any JDK; without one, run it in Docker:
#  docker run --rm -v "$PWD:/k" -w /k eclipse-temurin:21-jdk keytool …)
# A key that scripts/build-android.sh made (frontend/android/mochi.keystore, its password in
# keystore.properties) works too: then the app built locally and the released one update each other.
name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: dev, as a local build)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          [[ -n $TAG ]] || exit 0 # versionName dev, versionCode 1
          TAG=v${TAG#v}
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]] \
            || { echo "::error::$TAG isn't vX.Y.Z with minor and patch below 100."; exit 1; }
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          (( code > 0 )) || { echo "::error::The version must be above 0.0.0."; exit 1; }
          echo "name=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Only the project's key: an app signed with any other couldn't update to a release.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ -n $KEYSTORE && -n $PASSWORD ]] \
            || { echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see the top of android.yml)."; exit 1; }
          umask 077
          printf %s "$KEYSTORE" | base64 -d > frontend/android/mochi.keystore
          printf 'password=%s\n' "$PASSWORD" > frontend/android/keystore.properties
      # The same pinned toolchain (scripts/android.Dockerfile) and steps as a local build.
      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mochi-apk
          path: frontend/android/mochi.apk
          if-no-files-found: error

  # Apart from the build, so the code that builds (bun install, Gradle) never has a token that can write.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mochi-apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" mochi.apk --clobber
          else
            gh release create "$TAG" mochi.apk --verify-tag --generate-notes
          fi
